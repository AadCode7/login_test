<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Login Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0b1020;
      --surface: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f4f7ff;
      --muted: #9aa7c7;
      --primary: #6c8cff;
      --primary-hover: #5a7af5;
      --success: #3dd68c;
      --danger: #ff6b8a;
      --warning: #ffbe4f;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, sans-serif;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(108, 140, 255, 0.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(61, 214, 140, 0.15), transparent 30%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      align-items: stretch;
    }

    .hero, .card {
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(18px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(108, 140, 255, 0.15);
      color: #c9d6ff;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .hero p {
      color: var(--muted);
      line-height: 1.7;
      max-width: 42ch;
    }

    .card {
      padding: 32px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 6px;
    }

    .tab {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .tab.active {
      background: rgba(108, 140, 255, 0.18);
      color: var(--text);
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #d7e0f7;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(7, 12, 28, 0.65);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: rgba(108, 140, 255, 0.8);
      box-shadow: 0 0 0 4px rgba(108, 140, 255, 0.15);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: white;
      margin-top: 8px;
    }

    .divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin: 20px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: var(--border);
    }

    #google-btn-container {
      display: flex;
      justify-content: center;
      min-height: 44px;
    }

    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      display: none;
    }

    .message.error {
      display: block;
      background: rgba(255, 107, 138, 0.12);
      border: 1px solid rgba(255, 107, 138, 0.35);
      color: #ffc7d4;
    }

    .message.success {
      display: block;
      background: rgba(61, 214, 140, 0.12);
      border: 1px solid rgba(61, 214, 140, 0.35);
      color: #c9f7df;
    }

    .hints {
      margin-top: 10px;
      display: none;
      gap: 8px;
      flex-direction: column;
    }

    .hints.visible { display: flex; }

    .hint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .hint.valid { color: var(--success); }
    .hint.invalid { color: #f3b2c0; }

    .dashboard {
      display: none;
      text-align: center;
      padding: 48px 24px;
    }

    .dashboard.visible { display: block; }

    .dashboard h2 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .dashboard p { color: var(--muted); margin-bottom: 24px; }

    .link-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: auto;
      padding: 10px 18px;
    }

    .hidden { display: none !important; }

    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .hero { order: 2; padding: 28px; }
      .card { order: 1; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="badge">Portfolio</div>
      <h1>Secure access to your workspace</h1>
      <p>
        Sign in with email or use Google Signin.
      </p>
    </section>

    <section class="card" id="auth-card">
      <div id="auth-panel">
        <div class="tabs">
          <button class="tab active" id="tab-signin" type="button">Sign In</button>
          <button class="tab" id="tab-signup" type="button">Sign Up</button>
        </div>

        <form id="auth-form">
          <div class="field hidden" id="username-field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="your_username" />
          </div>

          <div class="field hidden" id="fullname-field">
            <label for="full_name">Full name</label>
            <input id="full_name" name="full_name" type="text" placeholder="Jane Doe" />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" required />
          </div>

          <div class="hints" id="password-hints">
            <div class="hint invalid" data-hint="min_length">At least 8 characters</div>
            <div class="hint invalid" data-hint="has_uppercase">One uppercase letter</div>
            <div class="hint invalid" data-hint="has_lowercase">One lowercase letter</div>
            <div class="hint invalid" data-hint="has_digit">One number</div>
            <div class="hint invalid" data-hint="has_special">One special character</div>
          </div>

          <button class="btn btn-primary" id="submit-btn" type="submit">Sign In</button>
        </form>

        <div class="divider">or continue with</div>
        <div id="google-btn-container"></div>
        <div class="message" id="message"></div>
      </div>

      <div class="dashboard" id="dashboard">
        <h2 id="welcome-text">Hello, User</h2>
        <p>You are signed in successfully.</p>
        <button class="btn link-btn" id="signout-btn" type="button">Sign Out</button>
      </div>
    </section>
  </div>

  <script>
    const API_BASE = window.location.origin;
    const GOOGLE_CLIENT_ID = "{{ google_client_id }}";
    const FRONTEND_URL = "{{ frontend_url }}";

    let mode = "signin";

    const tabSignin = document.getElementById("tab-signin");
    const tabSignup = document.getElementById("tab-signup");
    const authForm = document.getElementById("auth-form");
    const submitBtn = document.getElementById("submit-btn");
    const messageEl = document.getElementById("message");
    const passwordHints = document.getElementById("password-hints");
    const usernameField = document.getElementById("username-field");
    const fullnameField = document.getElementById("fullname-field");
    const authPanel = document.getElementById("auth-panel");
    const dashboard = document.getElementById("dashboard");
    const welcomeText = document.getElementById("welcome-text");
    const signoutBtn = document.getElementById("signout-btn");

    function setMessage(text, type = "error") {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
    }

    function clearMessage() {
      messageEl.textContent = "";
      messageEl.className = "message";
    }

    function setMode(nextMode) {
      mode = nextMode;
      tabSignin.classList.toggle("active", mode === "signin");
      tabSignup.classList.toggle("active", mode === "signup");
      submitBtn.textContent = mode === "signin" ? "Sign In" : "Create Account";
      usernameField.classList.toggle("hidden", mode !== "signup");
      fullnameField.classList.toggle("hidden", mode !== "signup");
      passwordHints.classList.toggle("visible", mode === "signup");
      clearMessage();
    }

    async function updatePasswordHints(password) {
      if (mode !== "signup" || !password) {
        passwordHints.classList.remove("visible");
        return;
      }

      passwordHints.classList.add("visible");
      const response = await fetch(`${API_BASE}/api/auth/validate-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      const data = await response.json();

      document.querySelectorAll(".hint").forEach((hintEl) => {
        const key = hintEl.dataset.hint;
        const valid = data.hints[key];
        hintEl.classList.toggle("valid", valid);
        hintEl.classList.toggle("invalid", !valid);
      });
    }

    function showDashboard(user) {
      authPanel.classList.add("hidden");
      dashboard.classList.add("visible");
      welcomeText.textContent = `Hello, ${user.full_name || user.username}`;
      localStorage.setItem("access_token", user.access_token || localStorage.getItem("access_token"));
      localStorage.setItem("user", JSON.stringify(user));
    }

    function showAuth() {
      authPanel.classList.remove("hidden");
      dashboard.classList.remove("visible");
      localStorage.removeItem("access_token");
      localStorage.removeItem("user");
    }

    async function handleAuthSuccess(data) {
      localStorage.setItem("access_token", data.access_token);
      localStorage.setItem("user", JSON.stringify(data.user));
      showDashboard({ ...data.user, access_token: data.access_token });
      setMessage("Welcome back!", "success");
    }

    tabSignin.addEventListener("click", () => setMode("signin"));
    tabSignup.addEventListener("click", () => setMode("signup"));

    document.getElementById("password").addEventListener("input", (event) => {
      updatePasswordHints(event.target.value);
    });

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();
      submitBtn.disabled = true;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        if (mode === "signup") {
          const username = document.getElementById("username").value.trim();
          const full_name = document.getElementById("full_name").value.trim();

          const response = await fetch(`${API_BASE}/api/auth/signup`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, username, password, full_name: full_name || null }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Signup failed");
          await handleAuthSuccess(data);
        } else {
          const response = await fetch(`${API_BASE}/api/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Login failed");
          await handleAuthSuccess(data);
        }
      } catch (error) {
        setMessage(error.message || "Something went wrong. Please try again.");
      } finally {
        submitBtn.disabled = false;
      }
    });

    signoutBtn.addEventListener("click", () => {
      showAuth();
      clearMessage();
      authForm.reset();
    });

    async function handleGoogleCredential(response) {
      clearMessage();
      try {
        const result = await fetch(`${API_BASE}/api/auth/google`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: response.credential }),
        });
        const data = await result.json();
        if (!result.ok) throw new Error(data.detail || "Google sign-in failed");
        await handleAuthSuccess(data);
      } catch (error) {
        setMessage(error.message || "Google sign-in failed.");
      }
    }

    function initGoogleSignIn() {
      if (!GOOGLE_CLIENT_ID) {
        document.getElementById("google-btn-container").innerHTML =
          '<p style="color:#9aa7c7;font-size:0.9rem;text-align:center;">Set GOOGLE_CLIENT_ID to enable Google Sign-In.</p>';
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential,
        auto_select: false,
      });

      google.accounts.id.renderButton(
        document.getElementById("google-btn-container"),
        { theme: "outline", size: "large", width: 320, text: "continue_with", shape: "pill" }
      );
    }

    async function restoreSession() {
      const token = localStorage.getItem("access_token");
      if (!token) return;

      try {
        const response = await fetch(`${API_BASE}/api/auth/me`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!response.ok) throw new Error("Session expired");
        const user = await response.json();
        showDashboard(user);
      } catch {
        localStorage.removeItem("access_token");
        localStorage.removeItem("user");
      }
    }

    window.addEventListener("load", () => {
      initGoogleSignIn();
      restoreSession();
    });
  </script>
</body>
</html>
